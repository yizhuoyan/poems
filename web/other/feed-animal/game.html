<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>游戏</title><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/game-iframe.css"></head><body><div id="game-app" class="screen active"><div class="game-header"><button id="btn-back" class="btn-back">← 返回</button><div class="score-display">得分：<span id="score-value">0</span></div><div class="combo-display">连击：<span id="combo-value">0</span></div><img id="game-avatar" class="avatar avatar-game" src="assets/images/avatar.png" alt="卷卷"></div><div id="guide-bubble" class="guide-bubble"><img class="guide-bubble-avatar" src="assets/images/avatar.png" alt="卷卷"><div class="guide-bubble-text" id="guide-bubble-text">我们开始吧！</div></div><div class="game-area"><div id="progress-dots" class="progress-dots"></div><div id="animal-zone" class="animal-zone"><div id="drop-indicator" class="drop-indicator"></div><div id="animal-display" class="animal-display"></div><div id="animal-name-label" class="animal-name-label"></div></div><div id="encourage-text" class="encourage-text"></div><div id="food-tray" class="food-tray"></div></div><div id="float-score" class="float-score">+10</div><div id="float-heart" class="float-heart">💗</div></div><div id="level-complete-overlay" class="overlay"><div class="overlay-content"><div id="confetti-container" class="confetti-container"></div><img id="celebrate-photo" class="celebrate-photo" src="" alt="庆祝"><h2 class="overlay-title"><span class="title-cn">过关啦！</span><span class="title-en">Level Complete!</span></h2><div id="stars-display" class="stars-display"><span class="star">⭐</span><span class="star">⭐</span><span class="star">⭐</span></div><div class="overlay-score">得分：<span id="final-score">0</span> 分</div><div class="overlay-buttons"><button id="btn-next-level" class="btn-primary">下一关 ➜</button><button id="btn-back-menu" class="btn-secondary">回主菜单</button></div></div></div><div id="drag-layer" class="drag-layer"></div><script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/game.js"></script><script src="js/game-ui.js"></script><script src="js/game-init.js"></script></body></html>
