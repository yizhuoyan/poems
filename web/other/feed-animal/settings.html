<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>游戏设置</title><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/settings.css"></head><body><div id="settings-app"><div class="settings-header"><button id="btn-close" class="btn-back">← 返回</button><span class="settings-title">游戏设置</span></div><div class="settings-body"><div class="settings-section"><div class="section-title">音效与音乐</div><div class="audio-toggle-row"><button id="btn-music" class="toggle-card"><span class="toggle-icon" id="music-icon">🎵</span><span class="toggle-label">音乐</span><span class="toggle-state" id="music-state">开</span></button><button id="btn-sfx" class="toggle-card"><span class="toggle-icon" id="sfx-icon">🔊</span><span class="toggle-label">音效</span><span class="toggle-state" id="sfx-state">开</span></button></div></div><div class="settings-section"><div class="section-title">关卡难度配置</div><div class="diff-table"><div class="diff-row diff-head"><span class="diff-cell label">关卡段</span><span class="diff-cell label">托盘数</span><span class="diff-cell label">正确数</span><span class="diff-cell label">喂对次数</span></div><div id="diff-rows"></div></div></div><div class="settings-section"><div class="section-title">动物-食物对应</div><div class="section-hint">点击 + 添加食物，长按已选食物删除</div><div id="animal-food-list" class="animal-food-list"></div></div></div><div class="settings-footer"><button id="btn-reset-defaults" class="btn-secondary">恢复默认</button><button id="btn-reset" class="btn-danger">重置进度</button><button id="btn-save" class="btn-primary">保存设置</button></div></div><div id="food-picker-overlay" class="food-picker-overlay"><div class="picker-content"><div class="picker-header"><span>为 <strong id="picker-animal-name"></strong> 添加食物</span><button id="btn-picker-close" class="btn-close">✕</button></div><div id="food-picker-grid" class="food-picker-grid"></div></div></div><div id="confirm-overlay" class="confirm-overlay"><div class="confirm-content"><p class="confirm-text">确定要重置所有进度吗？</p><div class="confirm-buttons"><button id="btn-confirm-yes" class="btn-danger">确定重置</button><button id="btn-confirm-no" class="btn-secondary">取消</button></div></div></div><script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/settings-init.js"></script></body></html>
