		<style>
			.player{
				display: block;
				border: 1px solid black;
				border-radius: 5px;
				font-size: 15px;
				font-weight: bold;
				float: left;
				width: 100px;
				height: 50px;
				text-align: center;
				margin-left: 10px;
				margin-top: 20px;
				padding-top: 30px;
				
				cursor: pointer;
			}
			/*等待中的玩家：不可点击*/
			.player.waiting{
				background-color: #f5f5f5;
				color: #aaa;
				border-color: #ddd;
				cursor: not-allowed;
			}
			/*当前可以查看题目的玩家*/
			.player.active{
				background-color: #fff8e1;
				outline: 2px solid #c0392b;
				outline-offset: 1px;
			}
			/*已查看过题目的玩家*/
			.player.viewed{
				background-color: #888;
				color: #fff;
				border-color: #888;
				cursor: default;
			}
			.topic-field{
				display: inline-block;
				white-space: nowrap;
			}
			.topic-sub-label{
				font-size: 13px;
				color: #666;
			}
			.topic-divider{
				margin: 0 6px;
				color: #999;
			}
			
			
			#topicManageEL{

				top:50px;
				bottom:50px;
				left:1em;
				right:1em;
				margin: auto;
				border: 1px solid black;
				text-align: center;
				background-color: #fff;
				z-index: 1;
				display: none;
			}

				拖把 扫帚
				抹布 百洁布
				垃圾桶 垃圾袋
				马桶刷 洁厕灵
				洗发水 沐浴露
				牙膏 漱口水
				台灯 落地灯
				加湿器 除湿机
				电暖器 电热毯
				显示器 曲面屏
				移动硬盘 固态硬盘
			</textarea>
			<p style="text-align: center;">
				<button onclick="closeTopicManageWindowBtnClick(this)">关闭</button>
			</p>
		</aside>
		<script>
			//游戏对象
			var game={
				"gameTopics":parseGameTopicELValue(),
				"currentPersonTopic":"好人题目",
				"currentMoleTopic":"卧底题目",
				//当前轮到查看题目的玩家下标（从0开始）
				"currentViewIndex":0
			}
			//游戏按钮
			function handleGameBtnClick(btn){
				if(btn.innerHTML=="开始游戏"){
					startGame(btn);
				}else{
					showWhoIsMole(btn);
				}
			}
			//开始游戏
			function startGame(btn){
				try{
					//确定题目
					var topic=determineTopic();
					//生成玩家
					var players=generatePlayers();
					//分配卧底
					allocateMole(players,topic);
					//从1号玩家开始，依次查看题目
					game.currentViewIndex=0;
					refreshPlayerViewState();
					btn.innerHTML="查看谁是卧底";
					//禁用按钮
					randomTopicBtn1.disabled=true
					randomTopicBtn2.disabled=true
				}catch(e){
					console.error(e);
					alert(e.message);
				}
			}
			//查看游戏结果
			var showWhoIsMole=function(btn){
				btn.innerHTML="开始游戏";
				//显示题目
				personTopicInput.value=personTopicInput.gameValue;
				moleTopicInput.value=moleTopicInput.gameValue;
				//按钮恢复
				randomTopicBtn1.disabled=false
				randomTopicBtn2.disabled=false
				
				var players=gameTableEL.children;
				//已公布结果，玩家不再可以查看题目
				game.currentViewIndex=players.length;
				for (var i = 0; i < players.length; i++) {
					var p=players[i];
					p.className="player";
					var topic=p.getAttribute("data-topic");
					if(topic==game.currentMoleTopic){
						p.style.backgroundColor="red"
					}else{
						
					}
					p.innerHTML=(i+1)+"<br>"+topic	
							
				}
			
			}
			//点击玩家
			function handlePlayerClick(el){
				var players=gameTableEL.children;
				//题目已全部查看或已公布结果
				if(game.currentViewIndex>=players.length){
					return;
				}
				//只有当前轮到序号的玩家可以查看题目
				var playerIndex=parseInt(el.getAttribute("data-player-index"));
				if(playerIndex!=game.currentViewIndex+1){
					alert("请先让 "+(game.currentViewIndex+1)+" 号玩家查看题目");
					return;
				}
				var topic=el.getAttribute("data-topic")
				alert("你的题目是："+topic)
				game.currentViewIndex++;
				refreshPlayerViewState();
			}
			//刷新玩家状态：仅当前玩家可以点击查看题目
			function refreshPlayerViewState(){
				var players=gameTableEL.children;
				for (var i = 0; i < players.length; i++) {
					var p=players[i];
					p.className="player";
					if(i<game.currentViewIndex){
						p.classList.add("viewed");
						p.innerHTML=p.getAttribute("data-player-index")+"<br>已查看";
					}else if(i==game.currentViewIndex){
						p.classList.add("active");
						p.innerHTML=p.getAttribute("data-player-index")+"<br>点击查看题目";
					}else{
						p.classList.add("waiting");
						p.innerHTML=p.getAttribute("data-player-index")+"<br>等待中";
					}
				}
			}
			//确定题目
			function determineTopic(){
				var rst=[];
				rst[0]=personTopicInput.value;
				if(rst[0].trim()==""){
					throw new Error("请填写好人题目")
				}
				
				rst[1]=moleTopicInput.value;
				if(rst[1].trim()==""){
					throw new Error("请填写卧底题目")
				}
				//和上次一样，自动随机
				if(rst[0]==game.currentPersonTopic){
					rst=randomTopic()
					if(!rst){
						throw new Error("已无更多游戏题目，请添加")
					}
				}
				
				personTopicInput.gameValue=rst[0]
				personTopicInput.value="***"
				moleTopicInput.value="***"
				moleTopicInput.gameValue=rst[1]
				return rst;
			}
			//生成玩家
			function generatePlayers(){
				var rst="";
				var playerCount=parseInt(playerCountInput.value);
				for (var i = 1; i <= playerCount; i++) {
					rst+=createPlayerHtml(i);
				}
				gameTableEL.innerHTML=rst;
				
				return gameTableEL.children;
			
			}
			//生成玩家html
			function createPlayerHtml(seq){
				var rst='<div class="player" data-player-index="'+seq+'" onclick="handlePlayerClick(this)">';
				rst+=seq;
				rst+="<br>点击查看题目"
				rst+="</div>";
				return rst;
			}
			//分配卧底
			function allocateMole(players,topic){
				game.currentPersonTopic=topic[0]
				game.currentMoleTopic=topic[1]
				//卧底数量
				var moleCount=parseInt(moleCountInput.value)
				var moleIndexArray=[];
				for (var i = 0; i < moleCount; i++) {
					var moleIndex=randomNextInt(0,players.length,moleIndexArray)
					moleIndexArray.push(moleIndex);
				}
								
				for (var i = 0; i < players.length; i++) {
					var p=players[i]
					if(moleIndexArray.indexOf(i)>=0){
						//is mole
						p.setAttribute("data-topic",game.currentMoleTopic)
					}else{
						p.setAttribute("data-topic",game.currentPersonTopic)
					}		
				}
				//删除已选题目，避免再次选中
				var gameTopics=game.gameTopics
				var currentTopicIndex=indexOfTopic(gameTopics,topic);
				if(currentTopicIndex>=0){
					gameTopics.splice(currentTopicIndex,1)	
				}
			}
		
			//随机生成题目
			function handleRandomTopicBtnClick(btn){
				
				var currentTopic=randomTopic()
				if(!currentTopic){
					alert("已无更多游戏题目，请添加")
					return;
				}
				personTopicInput.value=currentTopic[0];
				moleTopicInput.value=currentTopic[1];
				
			
			}
			//随机生成题目
			function randomTopic(){
				var gameTopics=game.gameTopics
				if(gameTopics.length==0){
					return;
				}
				
				var randomTopicIndex=Math.floor(Math.random()*100)%gameTopics.length;
				//和上次一样，直接+1
				if(game.randomTopicIndex==gameTopics[randomTopicIndex]){
					randomTopicIndex=(randomTopicIndex+1)%gameTopics.length;
				}
				game.randomTopicIndex=randomTopicIndex
				var currentTopic=gameTopics[randomTopicIndex];
				if(Math.random()>0.5){
					return [currentTopic[1],currentTopic[0]]	
				}
				return [currentTopic[0],currentTopic[1]]
			}
			
			//题目管理按钮
			function topicManageBtnClick(){
				//写入剩余题目
				var gameTopics=game.gameTopics
				var topicHtml="";
				for (var i = 0; i < gameTopics.length; i++) {
					topicHtml+=gameTopics[i].join(" ");
					topicHtml+="\n";
				}
				gameTopicEL.value=topicHtml;
				topicManageEL.style.display="block";
			}
		
			//题目管理关闭按钮
			function closeTopicManageWindowBtnClick(){
				topicManageEL.style.display="none";
				
				game.gameTopics=parseGameTopicELValue()
			}
			
			function parseGameTopicELValue(){
				var topicStr=gameTopicEL.value.trim()
				if(topicStr==""){
					return [];
				}
				var lines=topicStr.split(/(?:\r?\n)+/g);
				
				var rst=[];
				for(var i=0;i<lines.length;i++){
					var line=lines[i];
					
					line=line.replaceAll(/[^\u4e00-\u9fa5a-zA-Z·]+/g," ").trim()
					if(line.length==0){
						continue;
					}
					var tokens=line.split(/\s+/g);
					if(tokens.length>1){
						rst.push([tokens[0],tokens[1]]);
					}
				}
				var rst2=[];
				//去重
				for (var i = 0; i < rst.length;i++) {
					if(indexOfTopic(rst2,rst[i])==-1){
						rst2.push(rst[i])
					}
				}
				return rst2;
			}
			function indexOfTopic(arr,e){
				for (var i = 0; i < arr.length;i++) {
					var x=arr[i];
					if(x[0]==e[0]&&x[1]==e[1]){
						return i;
					}
					if(x[0]==e[1]&&x[1]==e[0]){
						return i;
					}
				}
				return -1;
			}
			
		</script>
		<script>
		
			function randomNextInt(a,b,arr){
				var tryMax=10;
				while(tryMax--){
					var x=Math.floor(Math.random()*Math.abs(a-b))+Math.min(a,b);
					if(arr.indexOf(x)==-1){
						return x;
					}
	
				}
				throw new Error("无法生成随机数，请检测a,b")
			}
		</script>
	</body>
</html>
