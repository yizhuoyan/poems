<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		  <meta name="applicable-device" content="pc,mobile" />
		<title>WHO IS MOLE</title>
		<style>
			#gameTableEL{
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
			}
			.player{
				display: block;
				border: 1px solid black;
				border-radius: 5px;
				font-size: 15px;
				font-weight: bold;
				float: left;
				width: 100px;
				height: 50px;
				text-align: center;
				margin-left: 10px;
				margin-top: 20px;
				padding-top: 30px;
				cursor: pointer;
				-webkit-user-select: none;
				user-select: none;
				touch-action: manipulation;
			}
			/*等待中的玩家：不可点击*/
			.player.waiting{
				background-color: #f5f5f5;
				color: #aaa;
				border-color: #ddd;
				cursor: not-allowed;
			}
			/*当前可以查看题目的玩家*/
			.player.active{
				background-color: #fff8e1;
				outline: 2px solid #c0392b;
				outline-offset: 1px;
			}
			/*已查看过题目的玩家*/
			.player.viewed{
				background-color: #888;
				color: #fff;
				border-color: #888;
				cursor: default;
			}
			.topic-field{
				display: inline-block;
				white-space: nowrap;
			}
			.topic-sub-label{
				font-size: 13px;
				color: #666;
			}
			.round-timer{
				margin-left: 18px;
			}
			/*全屏游戏模式*/
			.game-fullscreen-bar{
				display: none;
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				height: 56px;
				padding: 0 12px;
				box-sizing: border-box;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
				background-color: #fff;
				border-bottom: 1px solid #eee;
				z-index: 21;
			}
			.game-fullscreen-round{
				font-weight: bold;
			}
			.game-fullscreen-timer{
				color: #555;
				font-variant-numeric: tabular-nums;
			}
			.game-fullscreen-bar button{
				min-height: 34px;
				padding: 6px 12px;
				cursor: pointer;
			}
			body.game-fullscreen{
				overflow: hidden;
			}
			body.game-fullscreen header{
				display: none;
			}
			body.game-fullscreen .game-fullscreen-bar{
				display: flex;
			}
			body.game-fullscreen #gameTableEL{
				position: fixed;
				top: 0;
				right: 0;
				bottom: 0;
				left: 0;
				margin: 0;
				padding: 72px 12px 16px;
				box-sizing: border-box;
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(110px, 180px));
				gap: 12px;
				align-content: start;
				align-content: safe center;
				justify-content: center;
				overflow-y: auto;
				background-color: #fff;
				z-index: 20;
			}
			body.game-fullscreen .player{
				float: none;
				width: auto;
				height: auto;
				min-height: 80px;
				margin: 0;
				padding: 18px 8px;
				box-sizing: border-box;
				font-size: 18px;
				line-height: 1.6;
			}
			#roundHistoryEL{
				position: fixed;
				top: 50px;
				bottom: 50px;
				left: 1em;
				right: 1em;
				max-width: 720px;
				margin: auto;
				padding: 0 1em 1em;
				border: 1px solid #000;
				border-radius: 8px;
				background-color: #fff;
				text-align: center;
				z-index: 2;
				display: none;
				overflow: hidden;
			}
			#roundHistoryEL h2{
				margin: 12px 0;
			}
			.round-history{
				max-height: calc(100vh - 220px);
				overflow: auto;
				text-align: left;
				scrollbar-width: thin;
			}
			.round-history::-webkit-scrollbar{
				width: 8px;
				height: 8px;
			}
			.round-history::-webkit-scrollbar-thumb{
				background-color: #ccc;
				border-radius: 4px;
			}
			.round-history::-webkit-scrollbar-thumb:hover{
				background-color: #aaa;
			}
			.round-history-table-wrap{
				min-width: 100%;
			}
			.round-history-table{
				width: 100%;
				border-collapse: collapse;
				font-size: 13px;
			}
			.round-history-table th,
			.round-history-table td{
				padding: 7px 8px;
				border-bottom: 1px solid #eee;
				white-space: nowrap;
				text-align: center;
			}
			.round-history-table th{
				position: sticky;
				top: 0;
				z-index: 1;
				background-color: #f5f5f5;
				font-weight: bold;
			}
			.round-history-table tbody tr:hover{
				background-color: #fafafa;
			}
			.round-history-table td.round-history-empty{
				padding: 24px 8px;
			}
			.round-history-empty{
				padding: 24px 0;
				color: #999;
				text-align: center;
			}
			.round-history-running{
				padding: 8px 12px;
				margin-bottom: 10px;
				color: #999;
				font-size: 13px;
				text-align: center;
			}
			/*简易提示框*/
			.tips-mask{
				position: fixed;
				top: 0;
				right: 0;
				bottom: 0;
				left: 0;
				background-color: rgba(0,0,0,.45);
				display: none;
				align-items: center;
				justify-content: center;
				z-index: 30;
			}
			.tips-mask.show{
				display: flex;
			}
			.tips-box{
				min-width: 240px;
				max-width: 80vw;
				padding: 22px 20px 18px;
				border-radius: 10px;
				background-color: #fff;
				text-align: center;
				box-shadow: 0 8px 24px rgba(0,0,0,.2);
			}
			.tips-message{
				margin-bottom: 16px;
				font-size: 16px;
				font-weight: bold;
				line-height: 1.5;
				word-break: break-all;
			}
			.tips-message strong{
				margin-left: 2px;
				font-size: 24px;
				color: #c0392b;
				letter-spacing: 2px;
			}
			.tips-ok-btn{
				min-width: 80px;
				padding: 6px 16px;
				cursor: pointer;
			}
			/*新增题目弹窗*/
			#addTopicEL{
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%,-50%);
				width: 320px;
				max-width: 90vw;
				padding: 20px;
				border: 1px solid #000;
				border-radius: 10px;
				background-color: #fff;
				text-align: center;
				box-shadow: 0 8px 24px rgba(0,0,0,.25);
				z-index: 5;
				display: none;
			}
			#addTopicEL h2{
				margin: 0 0 8px;
				font-size: 18px;
			}
			#addTopicEL .add-topic-hint{
				margin: 0 0 12px;
				font-size: 13px;
				color: #999;
			}
			#addTopicEL .add-topic-error{
				min-height: 18px;
				margin: 4px 0 8px;
				color: #c0392b;
				font-size: 13px;
			}
			#addTopicEL input{
				width: 8em;
			}
			
			
			#topicManageEL{
				position:fixed;
				top:50px;
				bottom:50px;
				left:1em;
				right:1em;
				margin: auto;
				border: 1px solid black;
				text-align: center;
				background-color: #fff;
				z-index: 1;
				display: none;
				overflow-y: auto;
				padding: 0 1em 1em;
			}
			.topic-stats{
				text-align: left;
				max-width: 640px;
				max-height: calc(100vh - 210px);
				overflow-y: auto;
				margin: 0 auto;
			}
			#topicManageEL h2{
				margin: 12px 0;
			}
			.topic-stats table{
				width: 100%;
				border-collapse: collapse;
				margin-bottom: 12px;
			}
			.topic-stats td{
				padding: 4px 8px;
				border-bottom: 1px solid #eee;
			}
			.topic-stats td:last-child{
				text-align: right;
				color: #666;
			}
			.topic-stats-tip{
				font-size: 13px;
				color: #999;
			}
			/* ================= 视觉主题 ================= */
			*{
				box-sizing: border-box;
			}
			html,body{
				margin: 0;
			}
			body{

				background:
					radial-gradient(900px 500px at 8% -10%, #ffe8cc 0%, rgba(255,232,204,0) 60%),

			header{
				max-width: 980px;

				margin: 6px 0 0;
				font-size: 14px;

			}
			.setup-panel{

				gap: 14px 18px;

				border-radius: 20px;
				box-shadow: 0 16px 40px rgba(15,23,42,.07);

			.setup-panel .field{
				display: flex;

				gap: 10px;

			.setup-panel label{

			}
			.setup-panel .status-row{

			.status-row .round-timer{
				margin-left: 0;
			}
			.setup-panel .topics-field{
				grid-column: 1 / -1;
				flex-wrap: wrap;
				gap: 12px 18px;
			}
			.setup-panel .blank-prob-field{
				grid-column: 1 / -1;
				flex-wrap: wrap;
			}
			.field-hint{
				font-size: 12px;
				color: #94a3b8;
			}
			.topic-field{
				display: inline-flex;
				align-items: center;
				gap: 8px;
				white-space: nowrap;
			}
			.topic-sub-label{
				font-size: 14px;
				font-weight: 600;
				color: #475569;
			}
			.start-row{
				grid-column: 1 / -1;
				margin: 0;
			}
			.start-btn{
				width: 100%;
				padding: 13px 18px;
				font-size: 17px;
				font-weight: 700;
				letter-spacing: .5px;
				color: #fff;
				background: linear-gradient(135deg, #f59f00, #e8590c);
				border: 0;
				border-radius: 14px;
				box-shadow: 0 10px 24px rgba(232,89,12,.28);
			}
			.start-btn:hover{
				color: #fff;
				transform: translateY(-1px);
				box-shadow: 0 14px 28px rgba(232,89,12,.32);
			}
			input[type="number"],
			input[type="text"]{
				min-width: 0;
				padding: 9px 11px;
				font-family: inherit;
				font-size: 15px;
				color: #111827;
				background: #fff;
				border: 1px solid #dbe2ea;
				border-radius: 10px;
				transition: border-color .15s, box-shadow .15s;
			}
			input[type="number"]:focus,
			input[type="text"]:focus{
				outline: none;
				border-color: #f08c00;
				box-shadow: 0 0 0 3px rgba(240,140,0,.15);
			}
			#playerCountInput,
			#moleCountInput,
			#blankProbabilityInput{
				width: 5.5em;
			}
			.topic-field input{
				width: 150px;
			}
			button{
				padding: 8px 14px;
				font-family: inherit;
				font-size: 14px;
				color: #334155;
				background: #fff;
				border: 1px solid #dbe2ea;
				border-radius: 10px;
				cursor: pointer;
				transition: border-color .15s, color .15s, background .15s, transform .1s, box-shadow .15s;
			}
			button:hover{
				border-color: #f08c00;
				color: #c2410c;
			}
			button:active{
				transform: scale(.98);
			}
			.primary-btn,
			.tips-ok-btn{
				color: #fff;
				background: linear-gradient(135deg, #f59f00, #e8590c);

				font-weight: 700;
				box-shadow: 0 8px 18px rgba(232,89,12,.25);
			}
			.primary-btn:hover,
			.tips-ok-btn:hover{
				color: #fff;
				background: linear-gradient(135deg, #f59f00, #e8590c);
			}
			main#gameTableEL{
				max-width: 980px;
				margin: 0 auto;
				padding: 18px 18px 28px;
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 14px;
			}
			.player{
				display: block;
				width: 116px;
				height: auto;
				min-height: 92px;
				margin: 0;
				padding: 18px 8px;
				text-align: center;
				font-size: 15px;
				font-weight: 700;
				line-height: 1.55;
				color: #1f2937;
				background: #fff;
				border: 1px solid #e5e7eb;
				border-radius: 18px;
				box-shadow: 0 6px 16px rgba(15,23,42,.07);
				cursor: pointer;
				-webkit-user-select: none;

				touch-action: manipulation;
				transition: transform .15s, box-shadow .15s, background .2s, color .2s, border-color .2s;
			}
			.player:hover{
				transform: translateY(-2px);
				box-shadow: 0 10px 24px rgba(15,23,42,.12);
			}
			.player.waiting{

				color: #94a3b8;
				border-color: #e2e8f0;
				border-style: dashed;

			.player.active{
				background: linear-gradient(135deg, #fff4e6, #ffe8cc);

			}

			.player.blank{
				background: linear-gradient(135deg, #74c0fc, #4dabf7);

				border-color: transparent;
				box-shadow: 0 10px 24px rgba(77,171,247,.3);

				background: #0f172a;

			});
		</script>
		<script>
			//游戏对象
			var game={
				"currentPersonTopic":"好人题目",
				"currentMoleTopic":"卧底题目",
				//当前轮到查看题目的玩家下标（从0开始）
				"currentViewIndex":0,
				//当前轮次
				"round":1,
				//下一轮轮次
				"nextRound":1,
				//本轮是否进行中（已开始但未公布结果）
				"playing":false,
				//本轮开始时间戳（毫秒）
				"roundStartTime":null,
				//本轮计时器
				"roundTimerInterval":null,
				//已结束轮次的详情记录
				"roundHistory":[],
				//当前轮次详情（下一轮开始时结算）
				"currentRoundInfo":null,
				//本轮卧底玩家下标（从0开始）
				"currentMoleIndexes":[],
				//本轮白板玩家下标（从0开始）
				"currentBlankIndexes":[],
				//当前循环还未抽到的题目
				"topicPool":[],
				//最近两轮难度，用于保证连续3轮难度不完全相同
				"recentDifficulties":[],
				//最近一轮类别，尽量避免连续同类
				"recentCategories":[],
				//上一轮用过的题目key
				"lastTopicKey":null
			}
			//从全局题库拷贝一份题库A
			function resetTopicPool(){
				game.topicPool=TOPIC_LIBRARY.slice();
				//刚用过的题从A中移除，避免重新拷贝后立刻重复
				if(game.lastTopicKey){
					game.topicPool=game.topicPool.filter(function(entry){
						return getTopicKey(entry.good,entry.mole)!=game.lastTopicKey;
					});
				}
			}
			//题目key（忽略好人/卧底顺序）
			function getTopicKey(good,mole){
				return [good,mole].sort().join("|");
			}
			//按难度和类别约束筛选候选题目
			function filterTopicCandidates(pool,ignoreCategory){
				var recentDifficulties=game.recentDifficulties;
				var lastIndex=recentDifficulties.length-1;
				var blockedDifficulty=null;
				//最近两轮难度相同，本轮必须换难度（保证任意连续3轮至少1轮不同）
				if(recentDifficulties.length>=2&&recentDifficulties[lastIndex]!=null&&recentDifficulties[lastIndex]===recentDifficulties[lastIndex-1]){
					blockedDifficulty=recentDifficulties[lastIndex];
				}
				var lastCategory=game.recentCategories[game.recentCategories.length-1];
				return pool.filter(function(entry){
					if(blockedDifficulty!=null&&entry.difficulty===blockedDifficulty){
						return false;
					}
					if(!ignoreCategory&&lastCategory&&lastCategory!="手动"&&entry.category===lastCategory){
						return false;
					}
					return true;
				});
			}
			//随机抽取一道未用过的题目
			function pickTopic(){
				//题库A为空时，重新从全局题库拷贝
				if(game.topicPool.length==0){
					resetTopicPool();
				}
				//优先避开上一轮类别
				var candidates=filterTopicCandidates(game.topicPool,false);
				//同类题不够时，放宽类别限制，但难度约束保留
				if(candidates.length==0){
					candidates=filterTopicCandidates(game.topicPool,true);
				}
				//题库A剩余的题无法满足难度变化时，重新拷贝题库A
				if(candidates.length==0){
					resetTopicPool();
					candidates=filterTopicCandidates(game.topicPool,false);
					if(candidates.length==0){
						candidates=filterTopicCandidates(game.topicPool,true);
					}
				}
				if(candidates.length==0){
					candidates=game.topicPool;
				}
				var entry=candidates[Math.floor(Math.random()*candidates.length)];
				//用过的题目从题库A中删除
				var poolIndex=game.topicPool.indexOf(entry);
				if(poolIndex>=0){
					game.topicPool.splice(poolIndex,1);
				}
				game.lastTopicKey=getTopicKey(entry.good,entry.mole);
				//随机决定哪个词给好人、哪个词给卧底
				if(Math.random()>0.5){
					return {"category":entry.category,"difficulty":entry.difficulty,"good":entry.mole,"mole":entry.good};
				}
				return entry;
			}
			//自定义题目：本地持久保存
			var CUSTOM_TOPIC_STORAGE_KEY="whoIsMoleCustomTopics";
			var customTopics=[];
			function loadCustomTopics(){
				var saved=[];
				try{
					saved=JSON.parse(localStorage.getItem(CUSTOM_TOPIC_STORAGE_KEY)||"[]");
				}catch(e){
					console.error(e);
				}
				if(!Array.isArray(saved)){
					return;
				}
				saved.forEach(function(item){
					if(!item||typeof item.good!="string"||typeof item.mole!="string"){
						return;
					}
					var good=item.good.trim();
					var mole=item.mole.trim();
					if(good==""||mole==""||good==mole){
						return;
					}
					var key=getTopicKey(good,mole);
					var exists=TOPIC_LIBRARY.some(function(entry){
						return getTopicKey(entry.good,entry.mole)==key;
					});
					if(exists){
						return;
					}
					var topic={"category":"自定义","difficulty":2,"good":good,"mole":mole};
					customTopics.push(topic);
					TOPIC_LIBRARY.push(topic);
				});
			}
			function saveCustomTopics(){
				try{
					var data=customTopics.map(function(entry){
						return {"good":entry.good,"mole":entry.mole};
					});
					localStorage.setItem(CUSTOM_TOPIC_STORAGE_KEY,JSON.stringify(data));
				}catch(e){
					console.error(e);
				}
			}
			//新增题目弹窗
			function openAddTopic(){
				addGoodInput.value="";
				addMoleInput.value="";
				addTopicErrorEL.textContent="";
				addTopicEL.style.display="block";
				addGoodInput.focus();
			}
			function closeAddTopic(){
				addTopicEL.style.display="none";
			}
			function submitAddTopic(){
				var good=addGoodInput.value.trim();
				var mole=addMoleInput.value.trim();
				if(good==""||mole==""){
					addTopicErrorEL.textContent="好人词和卧底词都要填写";
					return;
				}
				if(good==mole){
					addTopicErrorEL.textContent="两个词不能相同";
					return;
				}
				var key=getTopicKey(good,mole);
				var exists=TOPIC_LIBRARY.some(function(entry){
					return getTopicKey(entry.good,entry.mole)==key;
				});
				if(exists){
					addTopicErrorEL.textContent="该题目已存在";
					return;
				}
				var topic={"category":"自定义","difficulty":2,"good":good,"mole":mole};
				TOPIC_LIBRARY.push(topic);
				//加入当前题库A，立刻可以抽到
				game.topicPool.push(topic);
				customTopics.push(topic);
				saveCustomTopics();
				closeAddTopic();
				showTips("已新增题目：<strong>{}</strong>",good+" / "+mole);
			}
			//读取本地自定义题目
			loadCustomTopics();
			//初始化题库A
			resetTopicPool();
			//简易提示框（替代浏览器 alert）
			//template 支持 HTML，{} 占位符按顺序替换为后续参数（参数会做 HTML 转义，避免注入）
			function showTips(template){
				var args=Array.prototype.slice.call(arguments,1);
				var argIndex=0;
				var html=String(template).replace(/\{\}/g,function(){
					var value=args[argIndex++];
					return value==null?"":escapeHtml(String(value));
				});
				tipsMessageEL.innerHTML=html;
				tipsMaskEL.classList.add("show");
				tipsOkBtn.focus();
			}
			//HTML 转义
			function escapeHtml(str){
				var escapeMap={"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"};
				return str.replace(/[&<>"']/g,function(ch){
					return escapeMap[ch];
				});
			}
			//点击确定关闭提示框
			tipsOkBtn.onclick=function(){
				tipsMaskEL.classList.remove("show");
			}
			//游戏按钮
			function handleGameBtnClick(btn){
				if(game.playing){
					showWhoIsMole(btn);
				}else{
					startGame(btn);
				}
			}
			//刷新轮次提示和游戏按钮文字
			function updateRoundUI(){
				roundInfoEL.textContent="第 "+game.round+" 轮";
				gameBtn.textContent=game.playing?"查看谁是卧底":"开始第"+game.nextRound+"轮游戏";
				gameFullscreenRoundEL.textContent=roundInfoEL.textContent;
			}
			updateRoundUI();
			//进入全屏游戏模式
			function enterGameFullscreen(){
				document.body.classList.add("game-fullscreen");
				gameFullscreenRoundEL.textContent="第 "+game.round+" 轮";
				gameFullscreenTimerEL.textContent=roundTimerEL.textContent;
			}
			//退出全屏游戏模式
			function exitGameFullscreen(){
				document.body.classList.remove("game-fullscreen");
			}
			//计时：格式化秒数
			function formatDuration(totalSeconds){
				var minutes=Math.floor(totalSeconds/60);
				var seconds=totalSeconds%60;
				return (minutes<10?"0":"")+minutes+":"+(seconds<10?"0":"")+seconds;
			}
			//计时：刷新当前轮用时
			function updateRoundTimerDisplay(){
				if(!game.roundStartTime){
					return;
				}
				var text=formatDuration(Math.floor((Date.now()-game.roundStartTime)/1000));
				roundTimerEL.textContent=text;
				gameFullscreenTimerEL.textContent=text;
			}
			//计时：开始本轮
			function startRoundTimer(){
				roundTimerEL.textContent="00:00";
				gameFullscreenTimerEL.textContent="00:00";
				game.roundStartTime=Date.now();
				game.roundTimerInterval=setInterval(updateRoundTimerDisplay,1000);
			}
			//计时：停止并返回本轮秒数
			function stopRoundTimer(){
				if(game.roundTimerInterval){
					clearInterval(game.roundTimerInterval);
					game.roundTimerInterval=null;
				}
				if(!game.roundStartTime){
					return 0;
				}
				var seconds=Math.round((Date.now()-game.roundStartTime)/1000);
				game.roundStartTime=null;
				return seconds;
			}
			//结束当前轮：记录详情（在点击下一轮“开始”时调用）
			function finishCurrentRound(){
				if(!game.roundStartTime||!game.currentRoundInfo){
					return;
				}
				var seconds=stopRoundTimer();
				var info=game.currentRoundInfo;
				info.seconds=seconds;
				game.roundHistory.push(info);
				game.currentRoundInfo=null;
				renderRoundHistory();
			}
			//渲染游戏记录列表
			function renderRoundHistory(){
				roundHistoryListEL.textContent="";
				if(game.roundStartTime){
					var running=document.createElement("div");
					running.className="round-history-running";
					running.textContent="第 "+game.round+" 轮进行中，点击下一轮“开始”后记录";
					roundHistoryListEL.appendChild(running);
				}
				var difficultyNames={1:"简单",2:"普通",3:"困难"};
				var wrapper=document.createElement("div");
				wrapper.className="round-history-table-wrap";
				var table=document.createElement("table");
				table.className="round-history-table";

				var thead=document.createElement("thead");
				var headRow=document.createElement("tr");
				["序号","题目类别","好人题目","卧底题目","卧底玩家","难易度","用时"].forEach(function(text){
					var th=document.createElement("th");
					th.textContent=text;
					headRow.appendChild(th);
				});
				thead.appendChild(headRow);
				table.appendChild(thead);

				var tbody=document.createElement("tbody");
				if(game.roundHistory.length==0){
					var emptyRow=document.createElement("tr");
					var emptyCell=document.createElement("td");
					emptyCell.colSpan=7;
					emptyCell.className="round-history-empty";
					emptyCell.textContent="暂无已结束的轮次";
					emptyRow.appendChild(emptyCell);
					tbody.appendChild(emptyRow);
				}else{
					game.roundHistory.forEach(function(item){
						var row=document.createElement("tr");
						var difficultyName=item.difficulty?difficultyNames[item.difficulty]:"—";
						var blankIndexes=item.blankIndexes||[];
						var molePlayers=item.moleIndexes&&item.moleIndexes.length?item.moleIndexes.map(function(index){
							return (index+1)+" 号"+(blankIndexes.indexOf(index)>=0?"（白板）":"");
						}).join("、"):"—";
						var values=[
							item.round,
							item.category,
							item.good,
							item.mole,
							molePlayers,
							difficultyName,
							formatDuration(item.seconds)
						];
						values.forEach(function(value){
							var cell=document.createElement("td");
							cell.textContent=value;
							row.appendChild(cell);
						});
						tbody.appendChild(row);
					});
				}
				table.appendChild(tbody);
				wrapper.appendChild(table);
				roundHistoryListEL.appendChild(wrapper);
			}
			//游戏记录弹窗
			function openRoundHistory(){
				renderRoundHistory();
				roundHistoryEL.style.display="block";
			}
			function closeRoundHistory(){
				roundHistoryEL.style.display="none";
			}
			//开始游戏
			function startGame(btn){
				try{
					//校验人数和卧底数量
					var playerCount=parseInt(playerCountInput.value,10);
					if(isNaN(playerCount)||playerCount<3||playerCount>10){
						throw new Error("游戏人数需在 3-10 之间")
					}
					var moleCount=parseInt(moleCountInput.value,10);
					if(isNaN(moleCount)||moleCount<1){
						throw new Error("卧底数量至少为 1")
					}
					if(moleCount>=playerCount){
						throw new Error("卧底数量必须小于游戏人数")
					}
					var blankProbability=parseInt(blankProbabilityInput.value,10);
					if(isNaN(blankProbability)||blankProbability<0||blankProbability>100){
						throw new Error("白板概率需在 0-100 之间")
					}
					//确定题目
					var topic=determineTopic();
					//生成玩家
					var players=generatePlayers();
					//分配卧底
					allocateMole(players,topic);
					//从1号玩家开始，依次查看题目
					game.currentViewIndex=0;
					refreshPlayerViewState();
					//点击“开始下一轮”时，上一轮才算结束
					finishCurrentRound();
					game.round=game.nextRound;
					//保存本轮详情，供下一轮开始时结算
					game.currentRoundInfo={
						"round":game.round,
						"good":topic.good,
						"mole":topic.mole,
						"category":topic.category,
						"difficulty":topic.difficulty,
						"moleIndexes":game.currentMoleIndexes.slice(),
						"blankIndexes":game.currentBlankIndexes.slice()
					};
					game.playing=true;
					updateRoundUI();
					startRoundTimer();
					enterGameFullscreen();
				}catch(e){
					console.error(e);
					showTips(e.message);
				}
			}
			//查看游戏结果
			var showWhoIsMole=function(btn){
				//公布结果；本轮计时继续，直到点击“开始下一轮”才结束
				exitGameFullscreen();
				game.playing=false;
				game.nextRound=game.round+1;
				updateRoundUI();
				//显示题目
				personTopicInput.value=personTopicInput.gameValue;
				moleTopicInput.value=moleTopicInput.gameValue;
				
				var players=gameTableEL.children;
				//已公布结果，玩家不再可以查看题目
				game.currentViewIndex=players.length;
				for (var i = 0; i < players.length; i++) {
					var p=players[i];
					p.className="player";
					var topic=p.getAttribute("data-topic");
					if(game.currentBlankIndexes.indexOf(i)>=0){
						p.classList.add("blank")
					}else if(topic==game.currentMoleTopic){
						p.classList.add("mole")
					}else{
						p.classList.add("good")
					}
					p.innerHTML=(i+1)+"<br>"+topic	
							
				}
			
			}
			//点击玩家
			function handlePlayerClick(el){
				var players=gameTableEL.children;
				//题目已全部查看或已公布结果
				if(game.currentViewIndex>=players.length){
					return;
				}
				//只有当前轮到序号的玩家可以查看题目
				var playerIndex=parseInt(el.getAttribute("data-player-index"));
				if(playerIndex!=game.currentViewIndex+1){
					showTips("请先让 "+(game.currentViewIndex+1)+" 号玩家查看题目");
					return;
				}
				var topic=el.getAttribute("data-topic")
				if(el.getAttribute("data-blank")=="1"){
					showTips("你是白板，没有题目，请伪装成好人")
				}else{
					showTips("你的题目是：<strong>{}</strong>",topic)
				}
				game.currentViewIndex++;
				refreshPlayerViewState();
			}
			//刷新玩家状态：仅当前玩家可以点击查看题目
			function refreshPlayerViewState(){
				var players=gameTableEL.children;
				for (var i = 0; i < players.length; i++) {
					var p=players[i];
					p.className="player";
					if(i<game.currentViewIndex){
						p.classList.add("viewed");
						p.innerHTML=p.getAttribute("data-player-index")+"<br>已查看";
					}else if(i==game.currentViewIndex){
						p.classList.add("active");
						p.innerHTML=p.getAttribute("data-player-index")+"<br>点击查看题目";
					}else{
						p.classList.add("waiting");
						p.innerHTML=p.getAttribute("data-player-index")+"<br>等待中";
					}
				}
			}
			//确定题目：手填优先，留空或与上一轮相同时自动随机
			function determineTopic(){
				var good=personTopicInput.value.trim();
				var mole=moleTopicInput.value.trim();
				var topic;
				//和上一轮完全一样时，自动换题，避免重复
				if(good!=""&&mole!=""&&!(good==game.currentPersonTopic&&mole==game.currentMoleTopic)){
					topic={"category":"手动","difficulty":null,"good":good,"mole":mole};
				}else{
					topic=pickTopic();
				}
				
				personTopicInput.gameValue=topic.good
				personTopicInput.value="***"
				moleTopicInput.value="***"
				moleTopicInput.gameValue=topic.mole
				return topic;
			}
			//生成玩家
			function generatePlayers(){
				var rst="";
				var playerCount=parseInt(playerCountInput.value);
				for (var i = 1; i <= playerCount; i++) {
					rst+=createPlayerHtml(i);
				}
				gameTableEL.innerHTML=rst;
				
				return gameTableEL.children;
			
			}
			//生成玩家html
			function createPlayerHtml(seq){
				var rst='<div class="player" data-player-index="'+seq+'" onclick="handlePlayerClick(this)">';
				rst+=seq;
				rst+="<br>点击查看题目"
				rst+="</div>";
				return rst;
			}
			//分配卧底
			function allocateMole(players,topic){
				game.currentPersonTopic=topic.good
				game.currentMoleTopic=topic.mole
				//记录本轮难度和类别，供下一轮出题约束
				game.recentDifficulties.push(topic.difficulty)
				if(game.recentDifficulties.length>2){
					game.recentDifficulties.shift()
				}
				game.recentCategories.push(topic.category)
				if(game.recentCategories.length>2){
					game.recentCategories.shift()
				}
				//卧底数量：等概率抽取不重复的玩家下标
				var moleCount=parseInt(moleCountInput.value,10)
				var moleIndexArray=pickMoleIndexes(players.length,moleCount);
				game.currentMoleIndexes=moleIndexArray;
				//白板概率：每名卧底独立判定是否变成白板
				var blankProbability=parseInt(blankProbabilityInput.value,10)
				if(isNaN(blankProbability)||blankProbability<0||blankProbability>100){
					blankProbability=0
				}
				var blankIndexArray=[];
				for (var i = 0; i < players.length; i++) {
					var p=players[i]
					if(moleIndexArray.indexOf(i)>=0){
						if(Math.random()*100<blankProbability){
							//is blank
							blankIndexArray.push(i)
							p.setAttribute("data-blank","1")
							p.setAttribute("data-topic","白板")
						}else{
							//is mole
							p.setAttribute("data-topic",game.currentMoleTopic)
						}
					}else{
						p.setAttribute("data-topic",game.currentPersonTopic)
					}		
				}
				game.currentBlankIndexes=blankIndexArray;
			}
		
			//题库统计按钮
			function topicManageBtnClick(){
				renderTopicStats()
				topicManageEL.style.display="block";
			}
		
			//题库统计关闭按钮
			function closeTopicManageWindowBtnClick(){
				topicManageEL.style.display="none";
			}
			//题库统计（只读）
			function renderTopicStats(){
				var total=TOPIC_LIBRARY.length;
				var remaining=game.topicPool.length;
				var categoryCount={};
				var difficultyCount={1:0,2:0,3:0};
				TOPIC_LIBRARY.forEach(function(entry){
					categoryCount[entry.category]=(categoryCount[entry.category]||0)+1;
					difficultyCount[entry.difficulty]++;
				});
				var difficultyNames={1:"简单",2:"普通",3:"困难"};
				var html="<p>题库总数 <strong>"+total+"</strong> 条，本轮循环剩余 <strong>"+remaining+"</strong> 条</p>";
				html+="<p><strong>按类别</strong></p><table>";
				Object.keys(categoryCount).forEach(function(category){
					html+="<tr><td>"+category+"</td><td>"+categoryCount[category]+" 条</td></tr>";
				});
				html+="</table>";
				html+="<p><strong>按难度</strong></p><table>";
				[1,2,3].forEach(function(level){
					html+="<tr><td>"+difficultyNames[level]+"</td><td>"+difficultyCount[level]+" 条</td></tr>";
				});
				html+="</table>";
				html+="<p class=\"topic-stats-tip\">每轮从题库A抽取并删除；题库A用完或无法满足难度变化时，重新从全局题库拷贝（避开上一题）。</p>";
				topicStatsEL.innerHTML=html;
			}
			
		</script>
		<script>
		
			//从 0..playerCount-1 中等概率抽取 moleCount 个不重复的玩家下标
			function pickMoleIndexes(playerCount,moleCount){
				var pool=[];
				for (var i = 0; i < playerCount; i++) {
					pool.push(i);
				}
				var result=[];
				for (var i = 0; i < moleCount; i++) {
					var index=Math.floor(Math.random()*pool.length);
					result.push(pool[index]);
					pool.splice(index,1);
				}
				return result;
			}
		</script>
