<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#0a0a0e" />
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0a0e'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23e9c57f' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23e9c57f'/%3E%3C/svg%3E"
        />
        <title>心有灵犀 · 传手机默契游戏</title>
        <style>
            :root {
                color-scheme: dark;
                --bg: #0a0a0e;
                --surface: #15151d;
                --border: rgba(255, 255, 255, 0.08);
                --border-strong: rgba(255, 255, 255, 0.14);
                --text: #f7f0e2;
                --muted: #a9a193;
                --muted-2: #918878;
                --gold: #e9c57f;
                --gold-bright: #ffe6b0;
                --gold-dim: rgba(233, 197, 127, 0.12);
                --red: #e07b6d;
                --red-dim: rgba(224, 123, 109, 0.12);
                --radius: 26px;
                --shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
                --font:
                    system-ui, -apple-system, "Segoe UI", "PingFang SC",
                    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
                --serif:
                    "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun",
                    serif;
            }

            * {
                box-sizing: border-box;
            }

            [hidden] {
                display: none !important;
            }

            html {
                min-height: 100%;
                background: var(--bg);
            }

            body {
                margin: 0;
                min-height: 100vh;
                min-height: 100dvh;
                display: flex;
                flex-direction: column;
                padding-top: max(18px, env(safe-area-inset-top, 0px));
                padding-right: max(18px, env(safe-area-inset-right, 0px));
                padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
                padding-left: max(18px, env(safe-area-inset-left, 0px));
                overflow-x: hidden;
                background:
                    radial-gradient(
                        760px 520px at 8% -8%,
                        rgba(233, 197, 127, 0.14),
                        transparent 66%
                    ),
                    radial-gradient(
                        620px 460px at 108% 18%,
                        rgba(224, 123, 109, 0.1),
                        transparent 68%
                    ),
                    radial-gradient(
                        760px 560px at 50% 112%,
                        rgba(233, 197, 127, 0.05),
                        transparent 70%
                    ),
                    var(--bg);
                color: var(--text);
                font-family: var(--font);
                -webkit-font-smoothing: antialiased;
                -webkit-text-size-adjust: 100%;
                text-size-adjust: 100%;
                overscroll-behavior-y: contain;
                -webkit-tap-highlight-color: transparent;
            }

            body.modal-open {
                overflow: hidden;
            }

            ::selection {
                background: rgba(233, 197, 127, 0.28);
            }

            button,
            input {
                font: inherit;
            }

            button {
                cursor: pointer;
            }

            button:disabled {
                cursor: not-allowed;
            }

            :focus-visible {
                outline: 2px solid var(--gold);
                outline-offset: 3px;
            }

            .display:focus,
            .title:focus,
            .hero-title:focus {
                outline: none;
            }

            #app {
                position: relative;
                z-index: 1;
                display: flex;
                flex: 1;
                flex-direction: column;
                width: 100%;
                max-width: 560px;
                margin: 0 auto;
            }

            .topbar {
                display: flex;
                align-items: center;
                min-height: 48px;
                padding-bottom: 14px;
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 9px;
                color: var(--muted);
                font-size: 13px;
                font-weight: 700;
                letter-spacing: 0.18em;
                white-space: nowrap;
            }

            .brand-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--gold);
                box-shadow: 0 0 14px rgba(233, 197, 127, 0.85);
            }

            #stage {
                display: flex;
                flex: 1;
                flex-direction: column;
                gap: 14px;
                min-height: 0;
                padding: 6px 0 10px;
            }

            .screen {
                display: flex;
                flex: 1;
                flex-direction: column;
                justify-content: center;
                gap: 18px;
                width: 100%;
                min-height: 0;
            }

            .panel {
                position: relative;
                width: 100%;
                padding: 26px 22px;
                overflow: hidden;
                border: 1px solid var(--border);
                border-radius: var(--radius);
                background: linear-gradient(
                    165deg,
                    rgba(32, 32, 44, 0.94),
                    rgba(18, 18, 25, 0.97)
                );
                box-shadow: var(--shadow);
                animation: panel-rise 0.24s ease-out;
            }

            .panel::before {
                content: "";
                position: absolute;
                top: 0;
                right: 12%;
                left: 12%;
                height: 1px;
                background: linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.22),
                    transparent
                );
                pointer-events: none;
            }

            @keyframes panel-rise {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                min-height: 52px;
                padding: 0 22px;
                border: 1px solid transparent;
                border-radius: 16px;
                background: transparent;
                color: var(--text);
                font-size: 16px;
                font-weight: 700;
                letter-spacing: 0.02em;
                line-height: 1.2;
                text-align: center;
                touch-action: manipulation;
                user-select: none;
                transition:
                    transform 0.15s ease,
                    background 0.15s ease,
                    border-color 0.15s ease,
                    box-shadow 0.15s ease,
                    opacity 0.15s ease;
            }

            .btn:active {
                transform: translateY(1px) scale(0.995);
            }

            .btn.primary {
                background: linear-gradient(
                    180deg,
                    #ffe4a8 0%,
                    #e9c57f 52%,
                    #d2a653 100%
                );
                color: #241b0a;
                box-shadow:
                    0 14px 32px rgba(233, 197, 127, 0.2),
                    inset 0 1px 0 rgba(255, 255, 255, 0.55);
            }

            .btn.secondary {
                border-color: var(--border-strong);
                background: rgba(255, 255, 255, 0.055);
                color: var(--text);
            }

            .btn.ghost {
                border-color: var(--border);
                background: transparent;
                color: var(--muted);
            }

            .btn.block {
                width: 100%;
            }

            .btn:disabled {
                opacity: 0.35;
                transform: none;
            }

            .eyebrow {
                margin: 0;
                color: var(--gold);
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.2em;
                line-height: 1.4;
                text-transform: uppercase;
            }

            .display {
                margin: 0;
                font-size: clamp(30px, 9vw, 44px);
                font-weight: 800;
                letter-spacing: -0.02em;
                line-height: 1.24;
                text-align: center;
                text-wrap: balance;
            }

            .display .accent {
                color: var(--gold);
            }

            .title {
                margin: 0;
                font-size: clamp(26px, 7.5vw, 32px);
                font-weight: 800;
                letter-spacing: -0.02em;
                line-height: 1.25;
                text-wrap: balance;
            }

            .lede {
                margin: 0;
                color: var(--muted);
                font-size: 14.5px;
                line-height: 1.7;
            }

            .note {
                margin: 0;
                color: var(--muted-2);
                font-size: 12.5px;
                line-height: 1.65;
                text-align: center;
            }

            .helper {
                margin: 0;
                color: var(--muted-2);
                font-size: 12.5px;
                line-height: 1.6;
            }

            .error {
                margin: 0;
                color: #ffb2a8;
                font-size: 13px;
                line-height: 1.5;
            }

            .hero {
                padding: 8px 4px 2px;
            }

            .kicker {
                margin: 0 0 12px;
                color: var(--gold);
                font-size: 10.5px;
                font-weight: 700;
                letter-spacing: 0.28em;
            }

            .hero-title {
                margin: 0;
                font-family: var(--serif);
                font-size: clamp(50px, 16vw, 76px);
                font-weight: 700;
                letter-spacing: 0.06em;
                line-height: 1.08;
                text-wrap: balance;
                text-shadow: 0 8px 40px rgba(233, 197, 127, 0.12);
            }

            .hero-title .accent {
                color: var(--gold);
            }

            .hero-sub {
                margin: 14px 0 0;
                color: var(--muted);
                font-size: 15px;
                line-height: 1.7;
            }

            .hero-dots {
                display: flex;
                gap: 7px;
                margin-top: 18px;
            }

            .hero-dots span {
                width: 4px;
                height: 4px;
                border-radius: 50%;
                background: rgba(233, 197, 127, 0.5);
            }

            .setup-view {
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 22px;
            }

            .setup-card {
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            .field {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .field-head {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 12px;
            }

            .field-label {
                font-size: 15px;
                font-weight: 700;
                letter-spacing: 0.02em;
            }

            .field-note {
                color: var(--muted-2);
                font-size: 12.5px;
                line-height: 1.5;
                text-align: right;
            }

            .setup-note {
                margin: -6px 0 0;
                text-align: left;
            }

            .stepper {
                display: grid;
                grid-template-columns: 56px minmax(0, 1fr) 56px;
                align-items: center;
                gap: 12px;
            }

            .step-btn {
                min-height: 56px;
                border: 1px solid var(--border-strong);
                border-radius: 16px;
                background: rgba(255, 255, 255, 0.05);
                color: var(--text);
                font-size: 24px;
                font-weight: 600;
                line-height: 1;
            }

            .step-btn:disabled {
                opacity: 0.28;
            }

            .count {
                color: var(--gold-bright);
                font-family: var(--serif);
                font-size: 38px;
                font-weight: 700;
                line-height: 1;
                text-align: center;
            }

            .rules-link {
                align-self: center;
                padding: 8px 4px;
                border: 0;
                background: none;
                color: var(--gold);
                font-size: 13.5px;
                font-weight: 600;
                text-decoration: underline;
                text-decoration-color: rgba(233, 197, 127, 0.4);
                text-underline-offset: 4px;
            }

            .handoff {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 14px;
                padding: 34px 24px;
                text-align: center;
            }

            .handoff .eyebrow,
            .handoff .lede,
            .handoff .note {
                text-align: center;
            }

            .handoff .btn {
                margin-top: 6px;
            }

            .player-orb {
                display: grid;
                place-items: center;
                width: 78px;
                height: 78px;
                margin: 2px 0;
                border: 1px solid rgba(233, 197, 127, 0.32);
                border-radius: 50%;
                background: radial-gradient(
                    circle at 32% 24%,
                    rgba(255, 255, 255, 0.16),
                    var(--gold-dim) 68%
                );
                color: var(--gold-bright);
                font-family: var(--serif);
                font-size: 38px;
                line-height: 1;
                box-shadow:
                    inset 0 1px 0 rgba(255, 255, 255, 0.14),
                    0 12px 34px rgba(0, 0, 0, 0.28);
            }

            .input-panel,
            .guess-panel {
                display: flex;
                flex-direction: column;
                gap: 18px;
            }

            .input-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
            }

            .player-tag {
                display: inline-flex;
                align-items: center;
                min-height: 28px;
                padding: 3px 10px;
                border: 1px solid rgba(233, 197, 127, 0.25);
                border-radius: 999px;
                background: var(--gold-dim);
                color: var(--gold);
                font-size: 11.5px;
                font-weight: 700;
                letter-spacing: 0.04em;
                white-space: nowrap;
            }

            .answer-card {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                padding: 18px 16px 20px;
                overflow: hidden;
                border: 1px solid rgba(233, 197, 127, 0.24);
                border-radius: 20px;
                background: linear-gradient(
                    180deg,
                    rgba(233, 197, 127, 0.1),
                    rgba(233, 197, 127, 0.03)
                );
                text-align: center;
            }

            .answer-card::after {
                content: "";
                position: absolute;
                inset: 6px;
                border: 1px solid rgba(233, 197, 127, 0.08);
                border-radius: 15px;
                pointer-events: none;
            }

            .micro-label {
                color: var(--gold);
                font-size: 10.5px;
                font-weight: 700;
                letter-spacing: 0.22em;
            }

            .answer-word {
                color: var(--gold-bright);
                font-family: var(--serif);
                font-size: clamp(34px, 10vw, 46px);
                font-weight: 700;
                letter-spacing: 0.14em;
                line-height: 1.2;
                text-indent: 0.14em;
                overflow-wrap: anywhere;
            }

            .mini-label {
                margin: 0;
                color: var(--muted-2);
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.16em;
            }

            .hint-list {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .hint-item {
                display: flex;
                align-items: center;
                gap: 11px;
                min-height: 52px;
                padding: 10px 14px;
                border: 1px solid var(--border);
                border-radius: 15px;
                background: linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.055),
                    rgba(255, 255, 255, 0.025)
                );
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
            }

            .hint-item.is-extra {
                border-color: rgba(224, 123, 109, 0.28);
                background: linear-gradient(
                    180deg,
                    rgba(224, 123, 109, 0.1),
                    rgba(224, 123, 109, 0.03)
                );
            }

            .hint-player {
                display: grid;
                flex: none;
                place-items: center;
                width: 26px;
                height: 26px;
                border: 1px solid rgba(233, 197, 127, 0.22);
                border-radius: 50%;
                background: var(--gold-dim);
                color: var(--gold);
                font-size: 11px;
                font-weight: 800;
            }

            .hint-player.extra {
                border-color: rgba(224, 123, 109, 0.28);
                background: var(--red-dim);
                color: #f1a89e;
            }

            .hint-text {
                flex: 1;
                color: #fff8ea;
                font-size: 20px;
                font-weight: 700;
                letter-spacing: 0.16em;
                line-height: 1.4;
                text-align: center;
                text-indent: 0.16em;
                overflow-wrap: anywhere;
            }

            .hint-list.compact .hint-item {
                min-height: 44px;
                padding: 7px 12px;
            }

            .hint-list.compact .hint-text {
                font-size: 16px;
            }

            .hint-empty {
                padding: 18px;
                border: 1px dashed rgba(255, 255, 255, 0.14);
                border-radius: 15px;
                background: rgba(255, 255, 255, 0.02);
                color: var(--muted-2);
                font-size: 13px;
                line-height: 1.6;
                text-align: center;
            }

            .hint-form {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .label-row {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 12px;
            }

            .input {
                width: 100%;
                min-height: 58px;
                padding: 0 16px;
                border: 1px solid var(--border-strong);
                border-radius: 16px;
                outline: none;
                background: #0c0d13;
                color: var(--text);
                font-size: 18px;
                font-weight: 600;
                letter-spacing: 0.03em;
                -webkit-appearance: none;
                appearance: none;
                transition:
                    border-color 0.15s ease,
                    box-shadow 0.15s ease;
            }

            .input::placeholder {
                color: var(--muted-2);
                font-weight: 400;
                letter-spacing: 0;
            }

            .input:focus {
                border-color: rgba(233, 197, 127, 0.6);
                box-shadow: 0 0 0 3px rgba(233, 197, 127, 0.12);
            }

            .input.hint {
                min-height: 66px;
                font-family: var(--serif);
                font-size: 29px;
                letter-spacing: 0.3em;
                line-height: 1.2;
                text-align: center;
                text-indent: 0.3em;
            }

            .input.hint::placeholder {
                font-family: var(--font);
                font-size: 15px;
                font-weight: 400;
                letter-spacing: 0;
                text-indent: 0;
            }

            .counter {
                color: var(--muted-2);
                font-size: 12px;
                font-variant-numeric: tabular-nums;
                letter-spacing: 0.03em;
            }

            .counter.full {
                color: var(--gold);
            }

            .actions {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .answer-panel {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 18px;
                padding: 34px 24px;
                text-align: center;
            }

            .answer-panel .answer-card,
            .answer-panel .actions {
                width: 100%;
            }

            .hint-modal {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .modal {
                position: fixed;
                inset: 0;
                z-index: 100;
                display: flex;
                align-items: flex-end;
                justify-content: center;
                padding: 16px;
                padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            }

            .modal-backdrop {
                position: absolute;
                inset: 0;
                background: rgba(4, 4, 7, 0.72);
                -webkit-backdrop-filter: blur(6px);
                backdrop-filter: blur(6px);
            }

            .modal-card {
                position: relative;
                z-index: 1;
                width: 100%;
                max-width: 430px;
                max-height: calc(100dvh - 32px);
                padding: 24px;
                overflow-y: auto;
                border: 1px solid var(--border-strong);
                border-radius: 24px;
                background: linear-gradient(170deg, #1c1c26, #111118);
                box-shadow: var(--shadow);
                animation: modal-rise 0.18s ease-out;
            }

            @keyframes modal-rise {
                from {
                    opacity: 0;
                    transform: translateY(14px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            .modal-title {
                margin: 0 0 10px;
                font-size: 21px;
                font-weight: 800;
                letter-spacing: -0.01em;
            }

            .modal-body {
                color: var(--muted);
                font-size: 14px;
                line-height: 1.75;
            }

            .modal-text {
                margin: 0 0 14px;
            }

            .rules {
                display: grid;
                gap: 8px;
                margin: 0;
                padding-left: 1.15em;
            }

            .rules li {
                padding-left: 2px;
            }

            .rules li::marker {
                color: var(--gold);
            }

            .modal-actions {
                display: flex;
                gap: 10px;
                margin-top: 22px;
            }

            .modal-actions .btn {
                flex: 1;
                min-height: 48px;
                padding: 0 12px;
                font-size: 14.5px;
            }

            .noscript {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                padding: 24px;
                background: var(--bg);
                color: var(--text);
                font-family: var(--font);
                font-size: 16px;
                text-align: center;
            }

            @media (min-width: 520px) {
                .modal {
                    align-items: center;
                }
            }

            @media (max-height: 640px) and (orientation: landscape) {
                body {
                    padding-top: max(8px, env(safe-area-inset-top, 0px));
                    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
                }

                .topbar {
                    min-height: 40px;
                    padding-bottom: 6px;
                }

                #stage {
                    padding-top: 2px;
                }

                .screen {
                    justify-content: flex-start;
                    gap: 12px;
                }

                .panel {
                    padding: 20px;
                }

                .setup-view {
                    display: grid;
                    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                    align-items: center;
                    gap: 24px;
                }

                .hero {
                    padding: 0;
                }

                .hero-title {
                    font-size: clamp(32px, 6.5vw, 44px);
                }

                .hero-sub {
                    margin-top: 10px;
                    font-size: 13px;
                }

                .setup-card {
                    gap: 14px;
                    padding: 20px;
                }

                .stepper {
                    grid-template-columns: 48px minmax(0, 1fr) 48px;
                    gap: 8px;
                }

                .step-btn {
                    min-height: 48px;
                    font-size: 22px;
                }

                .count {
                    font-size: 32px;
                }

                .handoff,
                .answer-panel {
                    gap: 10px;
                    padding: 22px;
                }

                .display {
                    font-size: clamp(24px, 4.5vw, 32px);
                }

                .player-orb {
                    width: 60px;
                    height: 60px;
                    font-size: 30px;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 0.01ms !important;
                    animation-iteration-count: 1 !important;
                    scroll-behavior: auto !important;
                    transition-duration: 0.01ms !important;
                }
            }
        </style>
    </head>
    <body>
        <div id="app">
            <header class="topbar">
                <div class="brand">
                    <span class="brand-dot" aria-hidden="true"></span>心有灵犀
                </div>
            </header>
            <main id="stage"></main>

                const appEl = document.getElementById("app");
                const stageEl = document.getElementById("stage");
                const modalEl = document.getElementById("modal");
                const modalBackdropEl = document.getElementById("modal-backdrop");
                const modalTitleEl = document.getElementById("modal-title");
                const modalBodyEl = document.getElementById("modal-body");
                const modalActionsEl = document.getElementById("modal-actions");

                const state = {
                    screen: "setup",
                    playerCount: 4,
                    answer: "",
                    hints: [],
                    hinterIndex: 0,
                };

                let lastFocused = null;

                function el(tag, className, text) {
                    const node = document.createElement(tag);
                    if (className) node.className = className;
                    if (text !== undefined && text !== null) {
                        node.textContent = String(text);
                    }
                    return node;
                }

                function append(parent, ...children) {
                    for (const child of children) {
                        if (child === null || child === undefined || child === false) {
                            continue;
                        }
                        parent.append(child);
                    }
                    return parent;
                }

                function button(label, variant, onClick) {
                    const node = el("button", "btn" + (variant ? " " + variant : ""), label);
                    node.type = "button";
                    if (onClick) node.addEventListener("click", onClick);
                    return node;
                }

                function hinterCount() {
                    return state.playerCount - 1;
                }

                function guesserName() {
                    return PLAYER_NAMES[state.playerCount - 1];
                }

                function validateHint(raw) {
                    if (!raw) return "请输入提示词。";
                    if (!/^\p{Script=Han}+$/u.test(raw)) {
                        return "提示只能是汉字。";
                    }
                    if ([...raw].length > MAX_HINT_LENGTH) {
                        return "提示最多 " + MAX_HINT_LENGTH + " 个汉字。";
                    }
                    for (const char of state.answer) {
                        if (raw.includes(char)) {
                            return "提示不能包含成语中的字。";
                        }
                    }
                    return "";
                }

                function pickWord() {
                    let word = WORDS[Math.floor(Math.random() * WORDS.length)];
                    if (WORDS.length > 1 && word === state.answer) {
                        word = WORDS[(WORDS.indexOf(word) + 1) % WORDS.length];
                    }
                    return word;
                }

                function startGame() {
                    state.answer = pickWord();
                    state.hints = [];
                    state.hinterIndex = 0;
                    state.screen = "handoff";
                    render();
                }

                function goHome() {
                    state.screen = "setup";
                    state.answer = "";
                    state.hints = [];
                    state.hinterIndex = 0;
                    render();
                }

                function submitHint(raw) {
                    const player = PLAYER_NAMES[state.hinterIndex];
                    state.hints.push({ player: player, text: raw, extra: false });
                    state.hinterIndex += 1;
                    state.screen =
                        state.hinterIndex < hinterCount()
                            ? "handoff"
                            : "guesser-handoff";
                    render();
                }

                function showAnswer() {
                    state.screen = "answer";
                    render();
                }

                function render() {
                    window.scrollTo(0, 0);
                    stageEl.replaceChildren();

                    let view;
                    switch (state.screen) {
                        case "setup":
                            view = setupView();
                            break;
                        case "handoff":
                            view = handoffView();
                            break;
                        case "hint-input":
                            view = hintInputView();
                            break;
                        case "guesser-handoff":
                            view = guesserHandoffView();
                            break;
                        case "guess":
                            view = guessView();
                            break;
                        case "answer":
                            view = answerView();
                            break;
                        default:
                            view = el("section", "panel");
                    }

                    const screen = el("div", "screen");
                    screen.append(view);
                    stageEl.append(screen);

                    requestAnimationFrame(() => {
                        const target = stageEl.querySelector(
                            '[data-autofocus="true"]',
                        );
                        if (target) target.focus({ preventScroll: true });
                    });
                }

                    const dots = el("div", "hero-dots");
                    dots.setAttribute("aria-hidden", "true");
                    for (let index = 0; index < 3; index += 1) {
                        dots.append(el("span"));
                    }
                    append(
                        hero,
                        el("p", "kicker", "HEART LINK · 默契挑战"),
                        el("h1", "hero-title", "心有灵犀"),
                        sub,
                        dots,
                    );

                    const card = el("section", "panel setup-card");

                    const head = el("div", "field-head");
                    append(
                        head,
                        el("span", "field-label", "玩家人数"),
                        el(
                            "span",
                            "field-note",
                            MIN_PLAYERS + "–" + MAX_PLAYERS + " 人",
                        ),
                    );

                    const countEl = el("div", "count", state.playerCount);
                    countEl.setAttribute("aria-live", "polite");
                    countEl.setAttribute("aria-atomic", "true");

                    const minus = el("button", "step-btn", "−");
                    minus.type = "button";
                    minus.setAttribute("aria-label", "减少一位玩家");

                    const plus = el("button", "step-btn", "+");
                    plus.type = "button";
                    plus.setAttribute("aria-label", "增加一位玩家");

                    const updatePlayers = (delta) => {
                        const next = Math.min(
                            MAX_PLAYERS,
                            Math.max(MIN_PLAYERS, state.playerCount + delta),
                        );
                        if (next === state.playerCount) return;
                        state.playerCount = next;
                        countEl.textContent = String(next);
                        minus.disabled = next <= MIN_PLAYERS;
                        plus.disabled = next >= MAX_PLAYERS;
                    };

                    minus.disabled = state.playerCount <= MIN_PLAYERS;
                    plus.disabled = state.playerCount >= MAX_PLAYERS;
                    minus.addEventListener("click", () => updatePlayers(-1));
                    plus.addEventListener("click", () => updatePlayers(1));

                    const stepper = el("div", "stepper");
                    append(stepper, minus, countEl, plus);

                    const setupNote = el(
                        "p",
                        "field-note setup-note",
                        "最后一位玩家猜词，前面的人依次提示。",
                    );

                    const start = button("开始游戏", "primary block", startGame);

                    append(card, head, stepper, setupNote, start);

                    const rulesLink = button("游戏说明", "rules-link", openRules);

                    append(wrap, hero, card, rulesLink);
                    return wrap;
                }

                function hintList(hints, options) {
                    const settings = options || {};
                    if (hints.length === 0) {
                        return el("div", "hint-empty", "暂时还没有提示。");
                    }
                    const list = el(
                        "div",
                        "hint-list" + (settings.compact ? " compact" : ""),
                    );
                    list.setAttribute("aria-label", settings.label || "提示词");
                    for (const hint of hints) {
                        const item = el(
                            "div",
                            "hint-item" + (hint.extra ? " is-extra" : ""),
                        );
                        const badge = el(
                            "span",
                            "hint-player" + (hint.extra ? " extra" : ""),
                            hint.extra ? "补" : hint.player,
                        );
                        badge.setAttribute(
                            "aria-label",
                            hint.extra
                                ? "追加提示"
                                : "玩家 " + hint.player + " 的提示",
                        );
                        const text = el("span", "hint-text", hint.text);
                        item.append(badge, text);
                        list.append(item);
                    }
                    return list;
                }

                function hintInputView() {
                    const player = PLAYER_NAMES[state.hinterIndex];
                    const isFirst = state.hinterIndex === 0;
                    const panel = el("section", "panel input-panel");

                    const head = el("div", "input-head");
                    append(
                        head,
                        el(
                            "p",
                            "eyebrow",
                            "提示 " +
                                (state.hinterIndex + 1) +
                                " / " +

                        el(
                            "span",
                            "player-tag",
                            isFirst
                                ? "玩家 " + player + " · 第一位"
                                : "玩家 " + player,
                        ),
                    );

                    const form = el("form", "hint-form");
                    form.noValidate = true;

                    const labelRow = el("div", "label-row");
                    const label = el("label", "field-label", "你的提示");
                    label.htmlFor = "hint-input";
                    const counter = el("span", "counter", "0 / " + MAX_HINT_LENGTH);
                    append(labelRow, label, counter);

                    const input = el("input", "input hint");
                    input.id = "hint-input";
                    input.type = "text";
                    input.maxLength = MAX_HINT_LENGTH;
                    input.placeholder = "输入 1–2 个汉字";
                    input.autocomplete = "off";
                    input.setAttribute("autocapitalize", "off");
                    input.setAttribute("autocorrect", "off");
                    input.setAttribute("spellcheck", "false");
                    input.setAttribute("enterkeyhint", "done");

                    const error = el("p", "error");
                    error.hidden = true;
                    error.setAttribute("role", "alert");

                    const helper = el(
                        "p",
                        "helper",
                        "最多 " +
                            MAX_HINT_LENGTH +
                            " 个汉字，不能包含成语中的字。",
                    );
                    const submit = el("button", "btn primary block", "提交提示");
                    submit.type = "submit";

                    append(form, labelRow, input, error, helper, submit);

                    input.addEventListener("input", () => {
                        error.hidden = true;
                        const length = [...input.value].length;
                        counter.textContent =
                            length + " / " + MAX_HINT_LENGTH;
                        counter.classList.toggle(
                            "full",
                            length >= MAX_HINT_LENGTH,
                        );
                    });

                    form.addEventListener("submit", (event) => {
                        event.preventDefault();
                        const raw = input.value.trim();
                        const message = validateHint(raw);
                        if (message) {
                            error.textContent = message;
                            error.hidden = false;
                            input.focus();
                            return;
                        }
                        submitHint(raw);

                    append(panel, head, answerCard());
                    if (state.hints.length > 0) {
                        panel.append(el("p", "mini-label", "已有提示"));

                        form,
                        el("p", "note", "提交后请把手机交给下一位。"),

                function openModal(options) {
                    lastFocused = document.activeElement;
                    modalTitleEl.textContent = options.title || "";
                    modalBodyEl.replaceChildren();
                    if (options.text) {
                        modalBodyEl.append(el("p", "modal-text", options.text));
                    }
                    if (options.list) {
                        const list = el("ul", "rules");
                        for (const item of options.list) {
                            list.append(el("li", "", item));
                        }
                        modalBodyEl.append(list);
                    }
                    if (options.content) {
                        modalBodyEl.append(options.content);
                    }
                    modalActionsEl.replaceChildren();

                    const actionButtons = [];
                    for (const action of options.actions || []) {
                        const node = button(
                            action.label,
                            action.variant || "secondary",
                            () => {
                                const result = action.onSelect
                                    ? action.onSelect()
                                    : undefined;
                                if (result === false) return;
                                closeModal();
                                if (action.afterClose) action.afterClose();
                            },
                        );
                        modalActionsEl.append(node);
                        actionButtons.push(node);
                    }

                    modalEl.hidden = false;
                    appEl.inert = true;
                    document.body.classList.add("modal-open");
                    document.addEventListener("keydown", onModalKeydown);

                    requestAnimationFrame(() => {
                        const preferred = options.focusSelector
                            ? modalEl.querySelector(options.focusSelector)
                            : null;
                        if (preferred) {
                            preferred.focus({ preventScroll: true });
                        } else if (actionButtons.length > 0) {
                            actionButtons[0].focus({ preventScroll: true });
                        }
                    });
                }

                function closeModal() {
                    if (modalEl.hidden) return;
                    modalEl.hidden = true;
                    appEl.inert = false;
                    document.body.classList.remove("modal-open");
                    document.removeEventListener("keydown", onModalKeydown);
                    modalTitleEl.textContent = "";
                    modalBodyEl.replaceChildren();
                    modalActionsEl.replaceChildren();

                    const target = lastFocused;
                    lastFocused = null;
                    if (
                        target &&
                        typeof target.focus === "function" &&
                        document.contains(target)
                    ) {
                        target.focus({ preventScroll: true });
                    }
                }

                function onModalKeydown(event) {
                    if (event.key === "Escape") {
                        event.preventDefault();
                        closeModal();
                        return;
                    }
                    if (event.key !== "Tab") return;

                    const focusables = Array.from(
                        modalEl.querySelectorAll(
                            "button:not([disabled]), input:not([disabled])",
                        ),
                    );
                    if (focusables.length === 0) return;
                    const first = focusables[0];
                    const last = focusables[focusables.length - 1];
                    if (event.shiftKey && document.activeElement === first) {
                        event.preventDefault();
                        last.focus();
                    } else if (
                        !event.shiftKey &&
                        document.activeElement === last
                    ) {
                        event.preventDefault();
                        first.focus();
                    }
                }

                function tryAddExtraHint() {
                    const input = document.getElementById("extra-hint-input");
                    const error = document.getElementById("extra-hint-error");
                    if (!input || !error) return false;
                    const raw = input.value.trim();
                    const message = validateHint(raw);
                    if (message) {
                        error.textContent = message;
                        error.hidden = false;
                        input.focus();
                        return false;
                    }
                    state.hints.push({
                        player: "补",
                        text: raw,
                        extra: true,
                    });
                    return true;
                }

                    const labelRow = el("div", "label-row");

                    const input = el("input", "input hint");
                    input.id = "extra-hint-input";
                    input.type = "text";
                    input.maxLength = MAX_HINT_LENGTH;
                    input.placeholder = "输入 1–2 个汉字";
                    input.autocomplete = "off";
                    input.setAttribute("autocapitalize", "off");
                    input.setAttribute("autocorrect", "off");
                    input.setAttribute("spellcheck", "false");
                    input.setAttribute("enterkeyhint", "done");

                    const error = el("p", "error");
                    error.id = "extra-hint-error";
                    error.hidden = true;
                    error.setAttribute("role", "alert");

                    const helper = el(
                        "p",
                        "helper",
                        "1～2 个汉字；不能包含成语中的字。",
                    );

                    append(content, labelRow, input, error, helper);

                    input.addEventListener("input", () => {
                        error.hidden = true;
                        const length = [...input.value].length;
                        counter.textContent =
                            length + " / " + MAX_HINT_LENGTH;
                        counter.classList.toggle(
                            "full",
                            length >= MAX_HINT_LENGTH,
                        );
                    });

                    input.addEventListener("keydown", (event) => {
                        if (event.key !== "Enter") return;
                        event.preventDefault();
                        if (tryAddExtraHint()) {
                            closeModal();
                            render();
                        }
                    });

                    openModal({
                        title: "追加提示词",
                        text: "请其他玩家输入，次数不限。",
                        content: content,
                        focusSelector: "#extra-hint-input",
                        actions: [
                            { label: "取消", variant: "ghost" },
                            {
                                label: "添加提示",
                                variant: "primary",
                                onSelect: tryAddExtraHint,
                                afterClose: render,
                            },
                        ],
                    });
                }

                function openRules() {
                    openModal({
                        title: "游戏说明",
                        list: [
                            "每局 3～5 人，最后一位玩家猜词，前面的人依次给提示。",
                            "玩家 A 先查看成语并给出第一个提示；之后每位提示者都能看到成语和前面所有提示。",
                            "每条提示 1～2 个汉字，不能出现成语中的字；重复提示允许。",
                            "猜词人只看提示词列表，口头说出答案。",
                            "需要时点「追加提示词」，由其他玩家输入，次数不限。",
                            "点「查看答案」显示本轮成语；App 不判断对错，也不记录结果。",
                        ],
                        actions: [{ label: "知道了", variant: "primary" }],
                    });
                }

                modalBackdropEl.addEventListener("click", closeModal);
                render();
            })();
        </script>
    </body>
</html>
