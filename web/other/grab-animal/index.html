<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<title>卷卷抓小动物</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 主菜单 -->
<div id="menu-screen" class="screen active">
  <div class="deco-bubbles">
    <span class="deco-bubble" style="--x:8%; --size:70px; --dur:14s; --delay:0s;"></span>
    <span class="deco-bubble" style="--x:22%; --size:40px; --dur:11s; --delay:3s;"></span>
    <span class="deco-bubble" style="--x:42%; --size:90px; --dur:16s; --delay:6s;"></span>
    <span class="deco-bubble" style="--x:66%; --size:50px; --dur:12s; --delay:2s;"></span>
    <span class="deco-bubble" style="--x:84%; --size:80px; --dur:15s; --delay:5s;"></span>
    <span class="deco-bubble" style="--x:95%; --size:36px; --dur:10s; --delay:8s;"></span>
  </div>
  <div class="menu-content">
    <h1 class="game-title">卷卷抓小动物</h1>
    <p class="game-subtitle">点泡泡 · 抓小动物</p>
    <div class="avatar-wrap avatar-menu">
      <img src="assets/images/avatar.png" alt="卷卷">
    </div>
    <button id="btn-start" class="btn-start">开始</button>
    <div class="menu-stats">
      <span id="menu-progress">第 1 关 · 已完成 0/10 关</span>
    </div>
    <div class="toggle-row">
      <button id="btn-music" class="toggle-btn on" title="音乐">🎵</button>
      <button id="btn-sfx" class="toggle-btn on" title="音效">🔊</button>
      <button id="btn-reset" class="toggle-btn reset-btn" title="重置进度">🔄</button>
      <button id="btn-fullscreen" class="toggle-btn fullscreen-btn" title="全屏">⛶</button>
    </div>
  </div>
</div>

<!-- 游戏画面 -->
<div id="game-screen" class="screen">
  <div class="game-top">
    <button id="btn-back" class="btn-back" title="返回">‹</button>
    <div id="hud-avatar" class="avatar-wrap avatar-hud">
      <img src="assets/images/avatar.png" alt="卷卷">
    </div>
    <div id="level-hud" class="level-hud">第 1 关</div>
    <div id="goal-hud" class="goal-hud">
      <span id="goal-count">0/2</span>
    </div>
  </div>
  <div id="bubble-field" class="bubble-field"></div>
  <div id="level-banner" class="level-banner">找出 3 只小动物！</div>
  <div id="collected-row" class="collected-row"></div>
</div>

<!-- 过关庆祝 -->
<div id="win-overlay" class="overlay">
  <div class="win-panel">
    <div class="win-title">过关啦！</div>
    <div class="win-parade" id="win-parade"></div>
    <div class="win-text" id="win-text">卷卷真棒！</div>
    <button id="btn-next-level" class="btn-start btn-next">下一关</button>
  </div>
</div>

<!-- 失败重试 -->
<div id="fail-overlay" class="overlay">
  <div class="win-panel fail-panel">
    <div class="fail-title">泡泡到 100 个啦</div>
    <div class="fail-text">没关系，再试一次吧！</div>
    <button id="btn-retry" class="btn-start btn-next">再试一次</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
