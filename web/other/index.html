<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <title>Links</title>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#11141c" media="(prefers-color-scheme: dark)" />
        <style>
            :root {
                --bg: #f4f6fb;
                --card: #ffffff;
                --text: #1d2433;
                --muted: #7b8496;
                --border: rgba(29, 36, 51, 0.08);
                --shadow: 0 1px 2px rgba(29, 36, 51, 0.04), 0 8px 24px rgba(29, 36, 51, 0.06);
                --shadow-hover: 0 2px 4px rgba(29, 36, 51, 0.06), 0 16px 40px rgba(29, 36, 51, 0.14);
                --accent: #5b7cfa;
                --radius: 18px;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                padding: 0;
            }

            body {
                min-height: 100vh;
                min-height: 100dvh;
                padding: 32px 16px calc(40px + env(safe-area-inset-bottom, 0px));
                padding-left: max(16px, env(safe-area-inset-left, 0px));
                padding-right: max(16px, env(safe-area-inset-right, 0px));
                background-color: var(--bg);
                background-image:
                    radial-gradient(680px 420px at 12% -10%, rgba(91, 124, 250, 0.18), transparent 70%),
                    radial-gradient(620px 400px at 92% 4%, rgba(255, 138, 101, 0.16), transparent 70%),
                    radial-gradient(560px 380px at 60% 108%, rgba(64, 201, 176, 0.14), transparent 70%);
                background-repeat: no-repeat;
                color: var(--text);
                font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
                    "Microsoft YaHei", sans-serif;
                -webkit-font-smoothing: antialiased;
                -webkit-text-size-adjust: 100%;
                text-size-adjust: 100%;
                -webkit-tap-highlight-color: transparent;
                text-rendering: optimizeLegibility;
            }

            .page {
                width: 100%;
                max-width: 980px;
                margin: 0 auto;
            }

            header {
                margin-bottom: 24px;
            }

            header h1 {
                margin: 0;
                font-size: clamp(26px, 8vw, 40px);
                font-weight: 700;
                letter-spacing: 0.06em;
                line-height: 1.2;
            }

            header h1::after {
                content: "";
                display: block;
                width: 44px;
                height: 3px;
                margin-top: 10px;
                border-radius: 999px;
                background: linear-gradient(90deg, #5b7cfa, #40c9b0);
            }

            header p {
                margin: 12px 0 0;
                color: var(--muted);
                font-size: 14px;
                letter-spacing: 0.02em;
            }

            .links {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
                gap: 12px;
                margin: 0;
                padding: 0;
                list-style: none;
            }

            .links a {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 84px;
                padding: 16px 12px;
                text-align: center;
                border: 1px solid var(--border);
                border-radius: var(--radius);
                background: var(--card);
                box-shadow: var(--shadow);
                color: inherit;
                font-size: 16px;
                font-weight: 600;
                line-height: 1.35;
                letter-spacing: 0.01em;
                text-decoration: none;
                overflow-wrap: anywhere;
                overflow: hidden;
                touch-action: manipulation;
                transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease,
                    background-color 0.18s ease;
            }

            /* 顶部彩色细条：每张卡片轮换一种强调色 */
            .links a::before {
                content: "";
                position: absolute;
                inset: 0 0 auto 0;
                height: 3px;
                background: var(--dot, var(--accent));
                opacity: 0.9;
            }

            .links li:nth-child(6n + 1) a { --dot: #5b7cfa; }
            .links li:nth-child(6n + 2) a { --dot: #40c9b0; }
            .links li:nth-child(6n + 3) a { --dot: #ff8a65; }
            .links li:nth-child(6n + 4) a { --dot: #b06bf2; }
            .links li:nth-child(6n + 5) a { --dot: #f2b544; }
            .links li:nth-child(6n + 6) a { --dot: #4fa8e8; }

            @media (hover: hover) and (pointer: fine) {
                .links a:hover {
                    transform: translateY(-3px);
                    box-shadow: var(--shadow-hover);
                    border-color: color-mix(in srgb, var(--dot, var(--accent)) 45%, transparent);
                }
            }

            .links a:focus-visible {
                outline: 2px solid var(--dot, var(--accent));
                outline-offset: 2px;
            }

            /* 触摸按压反馈：手机上没有 hover，用按下态给出明确响应 */
            .links a:active {
                transform: scale(0.97);
                background-color: color-mix(in srgb, var(--dot, var(--accent)) 10%, var(--card));
                border-color: color-mix(in srgb, var(--dot, var(--accent)) 45%, transparent);
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #11141c;
                    --card: #1a1f2b;
                    --text: #eef1f7;
                    --muted: #98a1b3;
                    --border: rgba(255, 255, 255, 0.08);
                    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.35);
                    --shadow-hover: 0 2px 6px rgba(0, 0, 0, 0.45), 0 18px 44px rgba(0, 0, 0, 0.55);
                }

                body {
                    background-image:
                        radial-gradient(680px 420px at 12% -10%, rgba(91, 124, 250, 0.22), transparent 70%),
                        radial-gradient(620px 400px at 92% 4%, rgba(255, 138, 101, 0.14), transparent 70%),
                        radial-gradient(560px 380px at 60% 108%, rgba(64, 201, 176, 0.14), transparent 70%);
                }
            }

            /* 平板 / 桌面：手机优先，此处按需放大 */
            @media (min-width: 560px) {
                body {
                    padding: 56px 24px calc(72px + env(safe-area-inset-bottom, 0px));
                }

                header {
                    margin-bottom: 36px;
                }

                header h1 {
                    font-size: clamp(32px, 4vw, 40px);
                }

                header h1::after {
                    width: 52px;
                    height: 4px;
                    margin-top: 14px;
                }

                header p {
                    margin-top: 16px;
                    font-size: 15px;
                }

                .links {
                    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                    gap: 18px;
                }

                .links a {
                    min-height: 96px;
                    padding: 24px 22px;
                    font-size: 17px;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .links a {
                    transition: none;
                }

                .links a:hover,
                .links a:active {
                    transform: none;
                }
            }
        </style>
    </head>
